[package]
name = "repo-yopparai"
version = "0.1.0"
description = "Repo-Yopparai"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.5.4", features = [] }
tauri-plugin-dialog = "2.6.0"
wait-timeout = "0.2.0"
dunce = "1.0.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
